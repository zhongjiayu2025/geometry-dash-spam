<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="32" fill="#020617"/>
  <text x="64" y="78" fill="#fff" font-family="Arial" font-size="36" font-weight="700">A quick evidence check for Geometry Dash advice</text>
  <g font-family="Arial">
    <rect x="80" y="165" width="1040" height="92" rx="20" fill="#0f172a" stroke="#22c55e"/>
    <text x="115" y="215" fill="#bbf7d0" font-size="25" font-weight="700">1. Can the claim be traced?</text>
    <text x="545" y="215" fill="#cbd5e1" font-size="20">Quote, ranking, rule or test result should point to a real source.</text>

    <rect x="80" y="280" width="1040" height="92" rx="20" fill="#0f172a" stroke="#3b82f6"/>
    <text x="115" y="330" fill="#bfdbfe" font-size="25" font-weight="700">2. Are the test conditions stated?</text>
    <text x="545" y="330" fill="#cbd5e1" font-size="20">Duration, device, technique and counting method change CPS results.</text>

    <rect x="80" y="395" width="1040" height="92" rx="20" fill="#0f172a" stroke="#f59e0b"/>
    <text x="115" y="445" fill="#fde68a" font-size="25" font-weight="700">3. Is a model being sold as reality?</text>
    <text x="545" y="445" fill="#cbd5e1" font-size="20">A browser simulator can train skills without proving official game physics.</text>

    <rect x="80" y="510" width="1040" height="92" rx="20" fill="#0f172a" stroke="#d946ef"/>
    <text x="115" y="560" fill="#f5d0fe" font-size="25" font-weight="700">4. Can you reproduce it?</text>
    <text x="545" y="560" fill="#cbd5e1" font-size="20">Repeatable instructions are more useful than unsupported universal numbers.</text>
  </g>
</svg>