<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="32" fill="#020617"/>
  <text x="64" y="78" fill="#fff" font-family="Arial" font-size="36" font-weight="700">Compare complete setups, not platform labels</text>
  <g font-family="Arial">
    <rect x="90" y="170" width="440" height="360" rx="28" fill="#082f49" stroke="#38bdf8"/>
    <text x="130" y="225" fill="#bae6fd" font-size="30" font-weight="700">Mobile / touch</text>
    <text x="130" y="285" fill="#e2e8f0" font-size="20">Touch hardware</text>
    <text x="130" y="330" fill="#e2e8f0" font-size="20">OS / browser or game client</text>
    <text x="130" y="375" fill="#e2e8f0" font-size="20">Display refresh / processing</text>
    <text x="130" y="420" fill="#e2e8f0" font-size="20">Device-specific input path</text>

    <rect x="670" y="170" width="440" height="360" rx="28" fill="#172554" stroke="#6366f1"/>
    <text x="710" y="225" fill="#c7d2fe" font-size="30" font-weight="700">PC / mouse / keyboard</text>
    <text x="710" y="285" fill="#e2e8f0" font-size="20">Mouse / keyboard hardware</text>
    <text x="710" y="330" fill="#e2e8f0" font-size="20">USB polling / debounce behavior</text>
    <text x="710" y="375" fill="#e2e8f0" font-size="20">OS / browser or game client</text>
    <text x="710" y="420" fill="#e2e8f0" font-size="20">Display refresh / processing</text>

    <text x="215" y="585" fill="#94a3b8" font-size="19">No universal “mobile” latency</text>
    <text x="795" y="585" fill="#94a3b8" font-size="19">No universal “PC” latency</text>
  </g>
</svg>