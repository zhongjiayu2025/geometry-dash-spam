    <text x="600" y="520" fill="#fde68a" font-size="25" font-weight="700">4. Adjust</text>
    <text x="600" y="557" fill="#cbd5e1" font-size="18">One variable at a time</text>

    <path d="M340 295Q420 180 475 180M725 180Q805 195 860 295M985 410Q875 500 725 520M475 520Q300 500 215 410" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="14 12"/>
