<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="32" fill="#020617"/>
  <text x="64" y="78" fill="#fff" font-family="Arial" font-size="36" font-weight="700">A repeatable Geometry Dash spam practice loop</text>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="600" cy="335" r="105" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <text x="600" y="325" fill="#fff" font-size="26" font-weight="700">Repeat</text>
    <text x="600" y="360" fill="#94a3b8" font-size="18">same setup</text>

