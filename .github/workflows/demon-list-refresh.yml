name: Refresh Search Data

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-demon-list.mjs"
      - "scripts/verify-demon-data.mjs"
      - "data/demons.ts"
      - "app/demon-list/**"
      - "app/hardest-level/page.tsx"
      - "components/DemonListTable.tsx"
      - "components/DemonListFilterControls.tsx"
      - "scripts/verify-vault-data.mjs"
      - "scripts/verify-related-games.mjs"
      - "scripts/verify-related-games-live.mjs"
      - "scripts/verify-dashmetry-live.mjs"
      - "data/vaultCodes.ts"
      - "data/relatedSearch.json"
      - "app/spam-challenge-list/page.tsx"
      - "app/dashmetry/page.tsx"
      - "app/geometry-dash-breeze/page.tsx"
      - ".github/workflows/demon-list-refresh.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demon-list-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh Pointercrate snapshot
        run: node scripts/update-demon-list.mjs

      - name: Validate Demon List data
        run: node scripts/verify-demon-data.mjs

      - name: Validate Wraith code freshness
        run: node scripts/verify-vault-data.mjs

      - name: Validate related game source freshness
        run: node scripts/verify-related-games.mjs

      - name: Validate Breeze latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-related-games-live.mjs

      - name: Validate Dashmetry rebrand and official home
        run: node scripts/verify-dashmetry-live.mjs

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- data/demons.ts; then
            echo "No Demon List changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demons.ts
          git commit -m "data: refresh Pointercrate demon list"
          git pull --rebase origin main
          git push origin HEAD:main
