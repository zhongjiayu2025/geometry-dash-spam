name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify data and exported site
        run: npm run verify

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          endpoint="https://geometrydashspam.cc/deploy-status.json"

          for attempt in {1..24}; do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${endpoint}?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            live_sha="$(printf '%s' "$body" | python3 -c 'import json,sys
try:
    print(json.load(sys.stdin).get("commit", ""))
except Exception:
    print("")' 2>/dev/null || true)"

            if [[ "$live_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production is serving expected commit $EXPECTED_SHA"
              printf '%s\n' "$body"
              exit 0
            fi

            echo "Attempt $attempt: production commit is '${live_sha:-missing}', expected '$EXPECTED_SHA'"
            sleep 15
          done

          echo "::error::Production is stale or deploy-status.json is unavailable. Expected commit: $EXPECTED_SHA"
          exit 1
