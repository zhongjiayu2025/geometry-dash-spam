name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify data and exported site
        run: npm run verify

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          endpoint="https://geometrydashspam.cc/deploy-status.json"

          last_checked_sha=""

          for attempt in {1..24}; do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${endpoint}?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            live_sha="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"

            if [[ "$live_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production is serving expected commit $EXPECTED_SHA"
              printf '%s\n' "$body"
              exit 0
            fi

            if [[ "$live_sha" =~ ^[0-9a-f]{40}$ && "$live_sha" != "$last_checked_sha" ]]; then
              last_checked_sha="$live_sha"
              compare_body="$(curl -fsS --connect-timeout 10 --max-time 20 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/compare/${EXPECTED_SHA}...${live_sha}" || true)"
              compare_status="$(printf '%s' "$compare_body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"

              if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
                echo "Production is serving descendant commit $live_sha; expected commit $EXPECTED_SHA is included"
                printf '%s\n' "$body"
                exit 0
              fi
            fi

            echo "Attempt $attempt: production commit is '${live_sha:-missing}', expected '$EXPECTED_SHA'"
            sleep 15
          done

          echo "::error::Production is stale or deploy-status.json is unavailable. Expected commit: $EXPECTED_SHA"
          exit 1

      - name: Verify sitemap and robots are crawler-readable
        shell: bash
        run: |
          set -euo pipefail

          sitemap_url="https://geometrydashspam.cc/sitemap.xml"
          robots_url="https://geometrydashspam.cc/robots.txt"
          googlebot_ua="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"

          sitemap_headers="$(mktemp)"
          sitemap_body="$(mktemp)"
          robots_headers="$(mktemp)"
          robots_body="$(mktemp)"

          curl -fsSL             --connect-timeout 10             --max-time 30             -A "$googlebot_ua"             -D "$sitemap_headers"             -o "$sitemap_body"             "$sitemap_url"

          sitemap_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$sitemap_headers")"
          sitemap_type="$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); value=$2} END {print tolower(value)}' "$sitemap_headers")"

          if [[ "$sitemap_status" != "200" ]]; then
            echo "::error::sitemap.xml returned HTTP $sitemap_status"
            cat "$sitemap_headers"
            exit 1
          fi

          if [[ "$sitemap_type" != *"xml"* ]]; then
            echo "::error::sitemap.xml Content-Type is '$sitemap_type', expected an XML MIME type"
            cat "$sitemap_headers"
            exit 1
          fi

          python3 - "$sitemap_body" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text or "" for node in root.findall("sm:url/sm:loc", ns)]

          if root.tag != "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset":
              raise SystemExit(f"unexpected sitemap root: {root.tag}")
          if len(urls) < 20:
              raise SystemExit(f"too few sitemap URLs: {len(urls)}")
          bad = [url for url in urls if not url.startswith("https://geometrydashspam.cc")]
          if bad:
              raise SystemExit(f"non-canonical sitemap URLs: {bad[:5]}")
          print(f"sitemap.xml parsed successfully with {len(urls)} URLs")
          PY

          curl -fsSL             --connect-timeout 10             --max-time 30             -A "$googlebot_ua"             -D "$robots_headers"             -o "$robots_body"             "$robots_url"

          robots_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$robots_headers")"
          robots_type="$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); value=$2} END {print tolower(value)}' "$robots_headers")"

          if [[ "$robots_status" != "200" ]]; then
            echo "::error::robots.txt returned HTTP $robots_status"
            cat "$robots_headers"
            exit 1
          fi

          if [[ "$robots_type" != *"text/plain"* ]]; then
            echo "::error::robots.txt Content-Type is '$robots_type', expected text/plain"
            cat "$robots_headers"
            exit 1
          fi

          grep -Fqi "Sitemap: https://geometrydashspam.cc/sitemap.xml" "$robots_body" || {
            echo "::error::robots.txt is missing the canonical sitemap declaration"
            cat "$robots_body"
            exit 1
          }

          echo "robots.txt and sitemap.xml are crawler-readable in production"

      - name: Verify production AdSense ownership files
        shell: bash
        run: |
          set -euo pipefail
          ads_url="https://geometrydashspam.cc/ads.txt"
          home_url="https://geometrydashspam.cc/"
          expected="google.com, pub-1528586776567779, DIRECT, f08c47fec0942fa0"

          curl -fsSL --connect-timeout 10 --max-time 30 "$ads_url" -o /tmp/geometrydashspam-ads.txt
          grep -Fx "$expected" /tmp/geometrydashspam-ads.txt >/dev/null || {
            echo "::error::Production ads.txt does not contain the authorized publisher line"
            exit 1
          }

          curl -fsSL --connect-timeout 10 --max-time 30 "$home_url" -o /tmp/geometrydashspam-home.html
          python3 - /tmp/geometrydashspam-home.html <<'PY'
          import re
          import sys

          html = open(sys.argv[1], encoding="utf-8").read()
          head = re.search(r"<head\b[^>]*>(.*?)</head>", html, re.I | re.S)
          if not head:
              raise SystemExit("Production homepage has no HTML head")

          expected = "adsbygoogle.js?client=ca-pub-1528586776567779"
          all_scripts = [m.group(0) for m in re.finditer(r"<script\b[^>]*>", html, re.I)]
          head_scripts = [m.group(0) for m in re.finditer(r"<script\b[^>]*>", head.group(1), re.I)]
          matches = [tag for tag in all_scripts if expected in tag]
          head_matches = [tag for tag in head_scripts if expected in tag]
          if len(matches) != 1 or len(head_matches) != 1 or not re.search(r"\basync(?:\s|=|>)", head_matches[0], re.I):
              raise SystemExit("Production AdSense script must be async, unique and inside HTML head")
          print("Production AdSense ownership verification passed: ads.txt + head script")
          PY

      - name: Verify only Google AdSense is authorized
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess
          import re

          allowed_seller = "google.com, pub-1528586776567779, DIRECT, f08c47fec0942fa0"
          seller_data = subprocess.check_output(
              ["curl", "-fsSL", "--connect-timeout", "10", "--max-time", "30",
               "https://geometrydashspam.cc/ads.txt"], text=True
          )
          seller_lines = [
              item.strip() for item in seller_data.splitlines()
              if item.strip() and not item.strip().startswith("#")
          ]
          if seller_lines != [allowed_seller]:
              raise SystemExit("Production ads.txt authorizes an unexpected advertising seller")

          blocked = re.compile(
              r"adsterra|highperformanceformat[.]com|profitableratecpm[.]com|"
              r"onclicka[.]com|\batOptions\s*=|monetag|propellerads[.]com|"
              r"onclickperformance[.]com",
              re.I
          )
          allowed_script = (
              "https://pagead2.googlesyndication.com/pagead/js/"
              "adsbygoogle.js?client=ca-pub-1528586776567779"
          )

          for route in ["/", "/cps-test", "/geometry-dash-wave", "/blog"]:
              html = subprocess.check_output(
                  ["curl", "-fsSL", "--connect-timeout", "10", "--max-time", "30",
                   "https://geometrydashspam.cc" + route], text=True
              )
              if blocked.search(html):
                  raise SystemExit("Production " + route + " contains a legacy ad-network signature")
              tags = re.findall(r"<script\b[^>]*>", html, re.I)
              for tag in tags:
                  match = re.search(r'\bsrc\s*=\s*["\x27]([^"\x27]+)["\x27]', tag, re.I)
                  if match and match.group(1).startswith(("http://", "https://")):
                      if match.group(1) != allowed_script:
                          raise SystemExit("Unexpected external production script on " + route + ": " + match.group(1))
              if sum(allowed_script in tag for tag in tags) != 1:
                  raise SystemExit("Expected one AdSense loader on production route " + route)
              print("AdSense-only production page verified: " + route)
          print("Only the authorized Google AdSense seller and loader are present")
          PY
