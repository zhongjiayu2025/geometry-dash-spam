name: Production Freshness

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-freshness
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve expected commit
        id: expected
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify production deployment
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        shell: bash
        run: |
          endpoint="https://geometrydashspam.cc/deploy-status.json"

          for attempt in {1..24}; do
            body="$(curl -fsS --connect-timeout 10 --max-time 20               -H 'Cache-Control: no-cache'               "${endpoint}?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"

            live_sha="$(printf '%s' "$body" | python3 -c '
import json, sys
try:
    print(json.load(sys.stdin).get("commit", ""))
except Exception:
    print("")
' 2>/dev/null || true)"

            if [[ "$live_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production is serving expected commit $EXPECTED_SHA"
              printf '%s\n' "$body"
              exit 0
            fi

            echo "Attempt $attempt: production commit is '${live_sha:-missing}', expected '$EXPECTED_SHA'"
            sleep 15
          done

          echo "::error::Production deployment is stale or deploy-status.json is unavailable. Expected commit: $EXPECTED_SHA"
          exit 1
